<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AEU 2026B 隨機選擇題練習</title>
<style>
:root{--navy:#0b2748;--blue:#176bba;--sky:#eaf5ff;--green:#16855b;--red:#c23b3b;--gold:#f2b744;--ink:#182433;--muted:#68778a}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#eaf5ff,#f8fbff 55%,#fff3de);min-height:100vh}
.top{background:var(--navy);color:white;padding:18px 20px;box-shadow:0 4px 18px #0b274833}.topin{max-width:860px;margin:auto;display:flex;align-items:center;gap:14px}.badge{font-size:30px}.top h1{font-size:clamp(20px,4vw,30px);margin:0}.top p{margin:4px 0 0;color:#cfe8ff}
.wrap{max-width:860px;margin:24px auto;padding:0 16px 40px}.panel{background:#fff;border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 35px #123b6320;border:1px solid #dceaf6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.stat{background:var(--sky);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px;color:var(--blue)}
.bar{height:9px;background:#e7edf3;border-radius:99px;overflow:hidden;margin:16px 0 24px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#48b6ef);width:0;transition:.35s}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{background:#eaf5ff;color:#135d9d;border-radius:99px;padding:5px 10px;font-weight:700;font-size:13px}.qno{color:var(--muted);font-size:14px}.question{font-size:clamp(20px,3vw,27px);line-height:1.35;margin:14px 0 20px}
.options{display:grid;gap:12px}.opt{width:100%;border:2px solid #dbe5ee;background:white;border-radius:14px;padding:15px 16px;text-align:left;font-size:16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s}.opt:hover:not(:disabled){border-color:#64a8df;transform:translateY(-1px);box-shadow:0 5px 12px #176bba16}.letter{flex:0 0 30px;height:30px;border-radius:50%;background:#edf3f8;display:grid;place-items:center;font-weight:800}.opt.wrong{border-color:#e68b8b;background:#fff1f1}.opt.wrong .letter{background:var(--red);color:white}.opt.correct{border-color:#67bf9e;background:#edfff7}.opt.correct .letter{background:var(--green);color:white}.opt:disabled{cursor:default}
.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px;line-height:1.5}.feedback.show{display:block}.feedback.bad{background:#fff2e1;border-left:5px solid #e28a23}.feedback.good{background:#eafff5;border-left:5px solid var(--green)}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer}.hint{background:#fff1c9;color:#714800}.reset{background:#e8edf2;color:#33475c}.next{background:var(--green);color:white;margin-left:auto}.btn:disabled{opacity:.45;cursor:not-allowed}
.start{text-align:center}.start h2{font-size:28px}.start p{color:var(--muted);line-height:1.6}.select{padding:11px;border:1px solid #ccd9e5;border-radius:10px;font-size:16px}.go{background:var(--blue);color:white;font-size:18px;padding:13px 24px}.hidden{display:none!important}.footer{text-align:center;color:#718095;font-size:13px;margin-top:16px}.result{text-align:center}.result .big{font-size:58px;font-weight:900;color:var(--blue)}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}.next{margin-left:0;width:100%}.topin{align-items:flex-start}.panel{border-radius:16px}.opt{padding:13px}}
</style></head><body>
<header class="top"><div class="topin"><div class="badge">✈️</div><div><h1>AEU 2026B 選擇題練習</h1><p>答錯有提示，答啱自動下一題，每次進入都會重新隨機排序</p></div></div></header>
<main class="wrap"><section class="panel">
<div id="start" class="start"><h2>準備好未？</h2><p>題目根據溫習筆記製作。每題答案及 A/B/C/D 選項都會隨機排列。<br>答錯不會立即顯示答案，可用 Hint 再試；答啱後會自動進入下一題。</p><p><select id="count" class="select"><option value="20">快速練習：20 題</option><option value="40">標準練習：40 題</option><option value="all">完整題庫：全部題目</option></select></p><button class="btn go" onclick="startQuiz()">開始練習</button></div>
<div id="quiz" class="hidden"><div class="stats"><div class="stat"><b id="done">0</b>已完成</div><div class="stat"><b id="score">0</b>答啱</div><div class="stat"><b id="wrong">0</b>錯誤次數</div><div class="stat"><b id="pct">0%</b>正確率</div></div><div class="bar"><i id="bar"></i></div><div class="meta"><span id="cat" class="tag"></span><span id="qno" class="qno"></span></div><h2 id="question" class="question"></h2><div id="options" class="options"></div><div id="feedback" class="feedback"></div><div class="actions"><button id="hintBtn" class="btn hint" onclick="showHint()">💡 Hint</button><button class="btn reset" onclick="restart()">重新開始</button><button id="nextBtn" class="btn next hidden" onclick="nextQuestion()">下一題 →</button></div></div>
<div id="result" class="result hidden"><h2>完成練習 🎉</h2><div id="finalScore" class="big"></div><p id="finalText"></p><button class="btn go" onclick="restart()">再做一次</button></div>
</section><div class="footer">Study aid based on AEU 2026B notes. Always follow the latest official manual and instructor guidance.</div></main>
<script>
const BANK=[{"q": "What is the pre-flight check of the DME Torch?", "a": "Secure, red indicator light is flashing.", "w": ["Secure and check serviceability.", "Secure only.", "Blue seal intact."], "h": "Think about both stowage and the torch's status indicator.", "c": "Equipment"}, {"q": "What is the minimum pressure required for a portable gaseous oxygen bottle during pre-flight check?", "a": "1,800 PSI", "w": ["500 PSI", "1,000 PSI", "2,500 PSI"], "h": "It is higher than 1,000 PSI but lower than 2,000 PSI.", "c": "Equipment"}, {"q": "At 4 L/min flow, how long will a fully charged oxygen bottle last?", "a": "60 minutes", "w": ["30 minutes", "90 minutes", "120 minutes"], "h": "Higher flow gives the shorter of the two standard durations.", "c": "Equipment"}, {"q": "At 2 L/min flow, how long will a fully charged oxygen bottle last?", "a": "120 minutes", "w": ["30 minutes", "60 minutes", "180 minutes"], "h": "Low flow lasts twice as long as 4 L/min.", "c": "Equipment"}, {"q": "What is the pre-flight check of a PBE?", "a": "Seal intact and indicator green.", "w": ["Secure and red disc intact.", "Wire seal intact.", "Black seal intact."], "h": "Check its seal and a coloured serviceability indicator.", "c": "Equipment"}, {"q": "What is the approximate duration of a PBE up to cabin altitude 25,000 ft?", "a": "15 minutes", "w": ["5 minutes", "30 minutes", "60 minutes"], "h": "It is designed for a short emergency firefighting period.", "c": "Equipment"}, {"q": "What is the pre-flight check of a HAFEX fire extinguisher?", "a": "Secure, safety pin and seal intact, pointer within green range.", "w": ["Secure and red disc intact.", "Secure and wire seal intact.", "In position only."], "h": "This extinguisher has a pressure pointer.", "c": "Fire"}, {"q": "What is the precaution when initially using a BCF extinguisher?", "a": "Stand 6 to 8 feet away, then move closer gradually.", "w": ["Stand 1 foot away.", "Keep the unit horizontal.", "Pour water before discharge."], "h": "Start at a safe distance before approaching the fire.", "c": "Fire"}, {"q": "What should be done immediately after a PED/lithium battery fire has been extinguished?", "a": "Pour non-flammable liquid on the device and cool it for about 15 minutes.", "w": ["Cover it with a blanket.", "Put ice on it.", "Immediately place it in the FireSock without cooling."], "h": "Prevent re-ignition by sustained cooling, but do not use ice.", "c": "Fire"}, {"q": "What is the correct oven-content fire drill?", "a": "Keep the oven door closed, switch off power and let the fire burn out.", "w": ["Open the oven and discharge BCF immediately.", "Pull the circuit breaker and open the door.", "Pour water into the oven."], "h": "Avoid feeding the fire with oxygen.", "c": "Fire"}, {"q": "Where is the FireSock Kit located?", "a": "Flight deck and L3", "w": ["Flight deck and L1", "R2 only", "All doors"], "h": "The cabin location is Door 3 on the left.", "c": "Equipment"}, {"q": "What is the pre-flight check of the crew life jacket?", "a": "Vinyl strap intact.", "w": ["Blue seal intact.", "In position.", "Red indicator flashing."], "h": "Unlike the infant equipment bag, this check refers to a strap.", "c": "Equipment"}, {"q": "When should an infant life jacket be inflated?", "a": "At the exit, just before leaving the aircraft.", "w": ["At the passenger seat.", "Before boarding.", "Only after entering the water."], "h": "Inflating too early can obstruct movement inside the cabin.", "c": "Evacuation"}, {"q": "What is the pre-flight check of the First Aid Kit?", "a": "Blue seal intact.", "w": ["Black seal intact.", "Wire seal intact.", "Pointer in green range."], "h": "The after-use seal changes colour to red.", "c": "Medical"}, {"q": "After using the First Aid Kit, which seal should be used to reseal it?", "a": "Red seal", "w": ["Blue seal", "Black seal", "Purple seal"], "h": "The colour shows that the kit has been used.", "c": "Medical"}, {"q": "What is the pre-flight check of the Universal Precaution Kit (UPK)?", "a": "Black seal intact.", "w": ["Blue seal intact.", "Red disc intact.", "Green indicator visible."], "h": "The UPK uses a dark-coloured seal before use.", "c": "Medical"}, {"q": "What is the pre-flight check of a Body Bag?", "a": "Black seal intact.", "w": ["Blue seal intact.", "Check expiry date only.", "In position only."], "h": "It shares the same pre-use seal colour as the UPK.", "c": "Medical"}, {"q": "What is the pre-flight check of a Megaphone?", "a": "Secure.", "w": ["Secure and pointer in green range.", "Red indicator flashing.", "Blue seal intact."], "h": "This is one of the simplest checks.", "c": "Equipment"}, {"q": "What is the pre-flight check of a Splint Pack?", "a": "In position.", "w": ["Blue seal intact.", "Black seal intact.", "Secure and pressure above 1,800 PSI."], "h": "No seal or gauge is part of this check.", "c": "Medical"}, {"q": "Who must be informed whenever a splint is used?", "a": "The Captain", "w": ["Only MedLink", "Ground engineer", "Airport police"], "h": "The person in command of the aircraft must be told.", "c": "Medical"}, {"q": "What is the normal adult pulse rate?", "a": "60-80 per minute", "w": ["40-60 per minute", "80-100 per minute", "100-120 per minute"], "h": "It is lower than a child's pulse rate.", "c": "Medical"}, {"q": "What is the normal adult breathing rate?", "a": "12-16 per minute", "w": ["6-10 per minute", "20-30 per minute", "30-40 per minute"], "h": "Adults breathe more slowly than children and infants.", "c": "Medical"}, {"q": "What is the normal child pulse rate?", "a": "80-100 per minute", "w": ["60-80 per minute", "100-120 per minute", "120-140 per minute"], "h": "It falls between the adult and infant ranges.", "c": "Medical"}, {"q": "What is the normal breathing rate for a child?", "a": "20-30 per minute", "w": ["10-12 per minute", "12-16 per minute", "30-40 per minute"], "h": "The child and infant ranges are the same in the notes.", "c": "Medical"}, {"q": "What is the treatment for a conscious person who is fainting?", "a": "Sit the casualty down, lean forward and place the head between the knees.", "w": ["Make the casualty stand and walk.", "Give food immediately.", "Lay flat with head raised."], "h": "The position helps restore blood flow to the brain.", "c": "Medical"}, {"q": "When should a casualty be placed in the recovery position?", "a": "When unconscious but breathing.", "w": ["When conscious and speaking.", "When not breathing.", "Only after an AED shock."], "h": "They have breathing but cannot protect their airway.", "c": "Medical"}, {"q": "What is the treatment for stroke?", "a": "Lay the casualty down with head and shoulders slightly raised and turn the head to one side.", "w": ["Raise both legs high.", "Make the casualty walk.", "Give food and drink immediately."], "h": "Protect the airway while supporting the head and shoulders.", "c": "Medical"}, {"q": "Vice-like chest pain that eases after rest most strongly suggests what?", "a": "Angina pectoris", "w": ["Stroke", "Shock", "Sinus headache"], "h": "This condition often improves with rest or the casualty's own medication.", "c": "Medical"}, {"q": "Severe bleeding, rapid pulse, clammy skin and thirst indicate what?", "a": "Shock", "w": ["Angina pectoris", "Stroke", "Hyperventilation"], "h": "Poor circulation after blood loss is the key clue.", "c": "Medical"}, {"q": "For an infant under one year who is choking, what is the first listed treatment?", "a": "Apply 5 back slaps with the heel of the hand.", "w": ["Apply 5 abdominal thrusts.", "Give water.", "Start with 30 chest compressions."], "h": "Abdominal thrusts are not used first for infants.", "c": "Medical"}, {"q": "For an obese choking casualty when abdominal thrusts cannot be applied, what should be used?", "a": "Chest thrusts", "w": ["Leg elevation", "Back slaps only", "Rescue breaths only"], "h": "Use an alternative thrust location above the abdomen.", "c": "Medical"}, {"q": "For a newborn infant not breathing after emergency childbirth, what should be done before the first CPR cycle?", "a": "Give 2 ventilations.", "w": ["Deliver an AED shock.", "Give 5 back slaps.", "Wait 2 minutes."], "h": "Provide initial breaths before compressions begin.", "c": "Medical"}, {"q": "What should you do immediately when the AED says it is analysing the heart rhythm?", "a": "Stop CPR and ensure nobody touches the casualty.", "w": ["Continue chest compressions.", "Remove the pads.", "Turn the AED off."], "h": "Movement can interfere with rhythm analysis.", "c": "AED/CPR"}, {"q": "After an AED shock is delivered, what is the next action?", "a": "Follow the prompt and begin CPR.", "w": ["Remove the AED pads.", "Place the casualty upright.", "Wait five minutes without touching the casualty."], "h": "Resume circulation support promptly.", "c": "AED/CPR"}, {"q": "Which is an AED precaution?", "a": "Do not use gaseous oxygen equipment while a shock is being delivered.", "w": ["Always remove the casualty from a seat first.", "Disconnect the pads after every analysis.", "Place both pads on the same side of the chest."], "h": "Think about fire risk during electrical shock delivery.", "c": "AED/CPR"}, {"q": "What does a normally serviceable Heartsine SAM 350P status indicator show?", "a": "Flashing green", "w": ["Steady red", "Flashing red", "No light"], "h": "Green means ready for use.", "c": "AED/CPR"}, {"q": "For an adult AED pad placement, where is the right pad positioned?", "a": "Below the right collarbone, to the right of the sternum.", "w": ["Over the left ribs below the breast.", "In the centre of the back.", "Directly over the sternum."], "h": "Think upper right chest.", "c": "AED/CPR"}, {"q": "What is the location of ELTs on A330/A350?", "a": "L2 and L4", "w": ["L1 and R1", "L2 and L5", "R2 and R4"], "h": "Airbus uses the two left-side locations ending in even numbers.", "c": "Equipment"}, {"q": "What is the location of ELTs on B773/B773ER?", "a": "L2 and L5", "w": ["L2 and L4", "L1 and R1", "R2 and R5"], "h": "For the 777, the aft location is Door 5.", "c": "Equipment"}, {"q": "How should a Rescu 406S ELT be deployed on sea water?", "a": "Tie it to the raft and place it in sea water; the antenna erects automatically.", "w": ["Keep it dry inside the raft.", "Submerge it without tethering.", "Mix salt and water in a bag first."], "h": "The salt-bag method is for land or fresh water.", "c": "Equipment"}, {"q": "How many classes of dangerous goods are there?", "a": "9", "w": ["6", "8", "12"], "h": "It is a single digit just below ten.", "c": "Dangerous Goods"}, {"q": "What is the maximum permitted dry ice quantity per person in the notes?", "a": "2.5 kg", "w": ["1 kg", "5 kg", "10 kg"], "h": "It is halfway between 2 and 3 kilograms.", "c": "Dangerous Goods"}, {"q": "What is the maximum number of spare lithium batteries per person in the notes?", "a": "20", "w": ["5", "10", "15"], "h": "It is five more than the PED device limit.", "c": "Dangerous Goods"}, {"q": "Where must spare lithium batteries be carried?", "a": "Carry-on baggage only", "w": ["Checked baggage only", "Either checked or carry-on without restriction", "Cargo hold only"], "h": "They must remain accessible in the cabin.", "c": "Dangerous Goods"}, {"q": "Where may e-cigarettes be carried?", "a": "Carry-on only", "w": ["Checked baggage only", "Both carry-on and checked baggage", "They must always be shipped as cargo"], "h": "They should not be placed in the aircraft hold.", "c": "Dangerous Goods"}, {"q": "Where may one small packet of safety matches be carried?", "a": "On one's person only", "w": ["Checked baggage only", "Carry-on bag only", "Either checked or carry-on bag"], "h": "Not inside any baggage.", "c": "Dangerous Goods"}, {"q": "What defines a dangerous goods occurrence?", "a": "DG found not properly loaded, segregated, separated, secured or documented in NOTOC.", "w": ["Any event causing a fatality.", "Only a fire involving DG.", "A correctly declared DG shipment."], "h": "It concerns a compliance failure that may not yet have caused injury or damage.", "c": "Dangerous Goods"}, {"q": "Which item is forbidden according to the notes?", "a": "Pepper spray / mace", "w": ["Securely packaged ammunition", "A mobile phone", "Dry ice within limit"], "h": "It is a self-defence spray.", "c": "Dangerous Goods"}, {"q": "If a removable lithium battery is fitted to baggage, what should be done?", "a": "Remove the battery and carry it in the cabin.", "w": ["Leave it installed and check the bag.", "Dispose of the baggage.", "Put the removed battery in checked baggage."], "h": "A loose lithium battery must stay accessible in carry-on baggage.", "c": "Dangerous Goods"}, {"q": "For A330 Door 3 during ditching, what is the immediate action?", "a": "Guard the door and redirect passengers.", "w": ["Open the door immediately.", "Change mode to disarmed and deploy the slide.", "Pull the manual inflation handle."], "h": "This door is not the primary usable ditching exit.", "c": "Doors/Evacuation"}, {"q": "For B777 Door 3 during planned ditching, what is the action?", "a": "Change mode to MANUAL, guard the door and redirect passengers.", "w": ["Keep AUTO and open the door.", "Pull the girt release handle.", "Use the overwing slide normally."], "h": "Door 3 is treated differently during ditching and requires a mode change.", "c": "Doors/Evacuation"}, {"q": "Where is the B777 Door 3 red manual inflation handle?", "a": "Upper aft corner of the door frame", "w": ["Right side of the girt bar", "Lower forward corner", "Behind the CACP"], "h": "Remember: upper, and toward the rear of the aircraft.", "c": "Doors/Evacuation"}, {"q": "In a nose-up land evacuation, which doors are usable according to the notes?", "a": "All doors/exits", "w": ["All except Door 1", "Only Door 3", "All except Door 4"], "h": "The revision notes say no door is excluded solely for nose-up attitude.", "c": "Doors/Evacuation"}, {"q": "If door power assist fails during evacuation, what should the door primary do?", "a": "Forcibly push the door open until it latches.", "w": ["Pull the manual inflation handle first.", "Close and permanently guard the door.", "Wait for the flight crew."], "h": "The first response is manual force on the door itself.", "c": "Doors/Evacuation"}, {"q": "On an Airbus door, which direction is ARMED?", "a": "Forward, toward the nose", "w": ["Aft, toward the tail", "Vertical", "Downward"], "h": "Airbus ARMED points toward the front of the aircraft.", "c": "Doors/Evacuation"}, {"q": "On a B777, which direction is AUTO?", "a": "Aft, toward the tail", "w": ["Forward, toward the nose", "Vertical", "Downward"], "h": "The B777 direction is opposite to Airbus ARMED.", "c": "Doors/Evacuation"}, {"q": "What should cabin crew do after the command 'Attention, Crew at Stations' about 2 minutes before touchdown?", "a": "Return to crew stations, secure themselves and conduct a silent review.", "w": ["Continue service.", "Go to the nearest interphone.", "Start evacuation immediately."], "h": "This is the final preparation before landing.", "c": "Emergency Procedures"}, {"q": "What are the four vital checks if emergency preparation time is limited?", "a": "Seat belts fastened, seat backs upright/TTL, tray tables stowed and PTVs stowed.", "w": ["Window blinds open, shoes removed, bags on laps and tables down.", "Brace position, armrests down, lights off and oxygen masks on.", "Life jackets inflated, doors open, baggage collected and seats reclined."], "h": "All four relate to the passenger seat area.", "c": "Emergency Procedures"}, {"q": "Which silent-review items are correct in addition to brace position and commands?", "a": "Evacuation duties, nearest available exits and required emergency equipment location.", "w": ["Meal count, local time and passenger loading.", "Destination weather, hotel and transport.", "Service duties, trolley count and catering stock."], "h": "Focus on escape and emergency responsibilities.", "c": "Emergency Procedures"}, {"q": "What should crew do after an Emergency Descent P/A?", "a": "Return to seats, fasten seat belts and prepare for possible depressurisation.", "w": ["Continue service until another P/A.", "Go directly to the flight deck.", "Open all oxygen compartments manually."], "h": "Secure yourself first because rapid altitude change may follow.", "c": "Emergency Procedures"}, {"q": "Which is a correct action after the aircraft has levelled off following depressurisation?", "a": "Check other crew, passengers' seat belts and aircraft structural damage.", "w": ["Re-stow all oxygen masks immediately.", "Resume meal service.", "Switch off passenger oxygen at once."], "h": "Do not attempt to re-stow deployed masks.", "c": "Emergency Procedures"}, {"q": "How is oxygen flow started from Airbus drop-down masks?", "a": "Pull the mask down.", "w": ["Wait for the mask to start automatically without pulling.", "Press OXY Stop.", "Use an MRT."], "h": "A physical pull activates the flow.", "c": "Emergency Procedures"}, {"q": "What is the cabin action during refuelling with passengers on board?", "a": "Opened doors connected to airbridge/steps must be manned by cabin crew.", "w": ["Closed cabin doors must be armed.", "All cabin crew may leave the aircraft.", "The seat belt sign must remain on throughout."], "h": "Usable exits must remain supervised and available.", "c": "Operations"}, {"q": "How does flight crew indicate refuelling is completed?", "a": "The seat belt sign is switched on.", "w": ["A STAR briefing is given.", "The emergency lights flash.", "The smoke alarm is cancelled."], "h": "A normal cabin sign is used as the signal.", "c": "Operations"}, {"q": "During moderate/severe turbulence, what indication is expected?", "a": "Seat belt sign ON and a P/A by flight crew.", "w": ["Cabin crew continue normal patrols.", "Seat belt sign cycled once only.", "All doors changed to manual."], "h": "Passengers are warned by both a sign and an announcement.", "c": "Operations"}];
let quiz=[],idx=0,score=0,errors=0,locked=false,wrongThis=false,timer=null;
const $=id=>document.getElementById(id); const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startQuiz(){let n=$('count').value;quiz=shuffle(BANK);if(n!=='all')quiz=quiz.slice(0,+n);idx=score=errors=0;$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){clearTimeout(timer);locked=false;wrongThis=false;let x=quiz[idx];$('cat').textContent=x.c;$('qno').textContent=`第 ${idx+1} / ${quiz.length} 題`;$('question').textContent=x.q;$('feedback').className='feedback';$('feedback').textContent='';$('nextBtn').classList.add('hidden');$('hintBtn').disabled=false;let opts=shuffle([x.a,...x.w]);$('options').innerHTML='';opts.forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${t}</span>`;b.onclick=()=>answer(b,t);$('options').appendChild(b)});update()}
function answer(btn,text){if(locked||btn.classList.contains('wrong'))return;let x=quiz[idx];if(text===x.a){locked=true;btn.classList.add('correct');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);score++;$('feedback').className='feedback good show';$('feedback').innerHTML='✅ <b>答啱！</b> 準備進入下一題。';$('nextBtn').classList.remove('hidden');$('hintBtn').disabled=true;update();timer=setTimeout(nextQuestion,1100)}else{btn.classList.add('wrong');btn.disabled=true;errors++;wrongThis=true;$('feedback').className='feedback bad show';$('feedback').innerHTML='❌ <b>未啱，再試一次。</b> 可以按 Hint 取得提示。';update()}}
function showHint(){let x=quiz[idx];$('feedback').className='feedback bad show';$('feedback').innerHTML='💡 <b>Hint：</b>'+x.h}
function nextQuestion(){if(!locked)return;if(idx<quiz.length-1){idx++;render()}else finish()}
function update(){$('done').textContent=idx;$('score').textContent=score;$('wrong').textContent=errors;let attempts=score+errors;$('pct').textContent=attempts?Math.round(score/attempts*100)+'%':'0%';$('bar').style.width=(idx/quiz.length*100)+'%'}
function finish(){clearTimeout(timer);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let p=Math.round(score/quiz.length*100);$('finalScore').textContent=p+'%';$('finalText').textContent=`${quiz.length} 題中答啱 ${score} 題，錯誤嘗試 ${errors} 次。每次重新開始都會再隨機抽題和重排答案。`}
function restart(){clearTimeout(timer);$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('start').classList.remove('hidden')}
</script></body></html>
