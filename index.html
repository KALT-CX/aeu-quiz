 intact.","w":["Blue seal intact.","Red disc intact.","In position only."],"h":"UPK uses a dark seal.","c":"Medical","id":20},{"q":"Pre-flight check of Body Bag?","a":"Black seal intact.","w":["Blue seal intact.","Check expiry date only.","Wire seal intact."],"h":"Same seal colour as UPK.","c":"Medical","id":21},{"q":"Pre-flight check of Megaphone?","a":"Secure.","w":["Blue seal intact.","Pointer green.","Red light flashing."],"h":"One of the simplest checks.","c":"Equipment","id":22},{"q":"Pre-flight check of Splint Pack?","a":"In position.","w":["Blue seal intact.","Black seal intact.","Secure at 1,800 PSI."],"h":"No gauge or seal.","c":"Medical","id":23},{"q":"Whenever a splint is used, who must be informed?","a":"The Captain","w":["Only MedLink","Ground engineer","Airport police"],"h":"Inform the person in command.","c":"Medical","id":24},{"q":"Which injury should the Splint Pack immobilise?","a":"Closed fracture","w":["Open fracture with protruding bone","Minor headache","Burn only"],"h":"The notes emphasise closed fractures.","c":"Medical","id":25},{"q":"Location of Splint Pack on Airbus?","a":"R1 and R4","w":["L1 and L4","R1 and R5","L2 and R2"],"h":"Airbus aft location is Door 4.","c":"Equipment","id":26},{"q":"Location of Splint Pack on B777?","a":"R1 and R5","w":["R1 and R4","L2 and L5","R2 only"],"h":"777 aft location is Door 5.","c":"Equipment","id":27},{"q":"Pre-flight check of AED FR2?","a":"Black seal intact and hourglass flashing.","w":["Break seal and run BIT.","Green ready light only.","Blue seal intact."],"h":"FR2 uses the hourglass indicator.","c":"AED/CPR","id":28},{"q":"Pre-flight check of AED FR3?","a":"Black seal intact and green ready light visible.","w":["Hourglass flashing.","Purple seal intact.","Pointer in green range."],"h":"FR3 has a green ready light.","c":"AED/CPR","id":29},{"q":"Normal Heartsine SAM 350P status indicator?","a":"Flashing green","w":["Steady red","Flashing red","No light"],"h":"Green means ready.","c":"AED/CPR","id":30},{"q":"If no spare Pad-Pak is available after AED use, reseal with?","a":"Purple seal","w":["Green seal","Blue seal","Red seal"],"h":"Purple indicates no replacement Pad-Pak fitted.","c":"AED/CPR","id":31},{"q":"If a spare Pad-Pak is fitted after use, reseal with?","a":"Green seal","w":["Purple seal","Red seal","Black seal"],"h":"Green follows replacement and successful status check.","c":"AED/CPR","id":32},{"q":"Location of ELT on A330/A350?","a":"L2 and L4","w":["L1 and R1","L2 and L5","R2 and R4"],"h":"Airbus aft location is L4.","c":"Equipment","id":33},{"q":"Location of ELT on B773/B773ER?","a":"L2 and L5","w":["L2 and L4","L1 and R1","R2 and R5"],"h":"777 aft location is L5.","c":"Equipment","id":34},{"q":"Rescu 406S minimum duration on 121.5/243 MHz?","a":"50 hours","w":["24 hours","15 hours","48 minutes"],"h":"The satellite frequency has the shorter duration.","c":"Equipment","id":35},{"q":"Rescu 406S minimum duration on 406 MHz?","a":"24 hours","w":["12 hours","50 hours","72 hours"],"h":"Satellite transmission duration.","c":"Equipment","id":36},{"q":"How to deploy Rescu 406S at sea?","a":"Tie to raft and place in sea water.","w":["Keep dry in raft.","Submerge without tether.","Use salt bag only."],"h":"Sea water activates it while tethered.","c":"Equipment","id":37},{"q":"How to operate Rescu 406S on land/fresh water?","a":"Mix salt with water-based liquid and place beacon in solution.","w":["Place dry on ground.","Set rotary switch to ARM only.","Submerge in sea water."],"h":"The salt solution simulates sea water.","c":"Equipment","id":38},{"q":"Techtest ELT during evacuation should be?","a":"Taken for land and ditching but not submerged.","w":["Submerged for activation.","Left on aircraft.","Placed inside FireSock."],"h":"This model is not water-submerged.","c":"Equipment","id":39},{"q":"B777 megaphone locations?","a":"L1, L2 and L4","w":["L1 and L5","All doors","R1 and R4"],"h":"Three left-side locations.","c":"Equipment","id":40},{"q":"Normal adult pulse rate?","a":"60–80/min","w":["40–60/min","80–100/min","100–120/min"],"h":"Lower than a child.","c":"Medical","id":41},{"q":"Normal adult breathing rate?","a":"12–16/min","w":["6–10/min","20–30/min","30–40/min"],"h":"Adults breathe slower than children.","c":"Medical","id":42},{"q":"Normal child pulse rate?","a":"80–100/min","w":["60–80/min","100–120/min","120–140/min"],"h":"Between adult and infant.","c":"Medical","id":43},{"q":"Normal infant pulse rate?","a":"100–120/min","w":["60–80/min","80–100/min","120–160/min"],"h":"Higher than a child.","c":"Medical","id":44},{"q":"Normal child/infant breathing rate?","a":"20–30/min","w":["12–16/min","30–40/min","40–60/min"],"h":"Same range in the notes.","c":"Medical","id":45},{"q":"Treatment for a conscious fainting casualty?","a":"Sit down, lean forward, head between knees.","w":["Make them walk.","Give food immediately.","Raise head while lying flat."],"h":"Position helps cerebral blood flow.","c":"Medical","id":46},{"q":"When use recovery position?","a":"Unconscious but breathing.","w":["Conscious and speaking.","Not breathing.","Only after AED shock."],"h":"Breathing exists but airway protection is needed.","c":"Medical","id":47},{"q":"Treatment for stroke?","a":"Head and shoulders slightly raised, head turned to one side.","w":["Raise both legs high.","Make casualty walk.","Give food and drink."],"h":"Support head and protect airway.","c":"Medical","id":48},{"q":"Vice-like chest pain eased by rest suggests?","a":"Angina pectoris","w":["Stroke","Shock","Sinus headache"],"h":"Often improves with rest or own medicine.","c":"Medical","id":49},{"q":"Severe bleeding, rapid pulse, clammy skin and thirst suggest?","a":"Shock","w":["Angina","Stroke","Hyperventilation"],"h":"Think poor circulation after blood loss.","c":"Medical","id":50},{"q":"First treatment for choking infant under one year?","a":"5 back slaps with heel of hand.","w":["5 abdominal thrusts.","Give water.","30 chest compressions first."],"h":"Do not begin with abdominal thrusts.","c":"Medical","id":51},{"q":"For obese choking casualty when abdominal thrusts cannot be applied?","a":"Chest thrusts","w":["Leg elevation","Back slaps only","Rescue breaths only"],"h":"Use an alternative thrust location.","c":"Medical","id":52},{"q":"Newborn not breathing after emergency childbirth: before first CPR cycle?","a":"Give 2 ventilations.","w":["Deliver AED shock.","Give 5 back slaps.","Wait 2 minutes."],"h":"Initial breaths first.","c":"Medical","id":53},{"q":"Treatment for sinus headache?","a":"Blow nose one side at a time.","w":["Pinch nose continuously.","Raise both legs.","Give solid food."],"h":"Relieve sinus pressure gently.","c":"Medical","id":54},{"q":"Treatment for food poisoning?","a":"Offer plenty of water and an airsickness bag.","w":["Encourage vomiting.","Move to aft cabin.","Give alcohol."],"h":"Hydration and an appropriate bag.","c":"Medical","id":55},{"q":"Treatment for strains and sprains?","a":"Apply ice pack and provide support.","w":["Massage strongly.","Give oxygen only.","Use AED."],"h":"Cold and support.","c":"Medical","id":56},{"q":"Treatment for alcohol intoxication?","a":"Keep warm, reassure and assess injury/medical condition.","w":["Give sweet drinks.","Encourage vomiting.","Make casualty walk."],"h":"Protect, monitor and assess.","c":"Medical","id":57},{"q":"Signs of 3rd-degree/deep burn?","a":"Skin waxy and charred.","w":["Only mild redness.","Itchy eyes.","Cold clammy skin only."],"h":"Deep burns alter skin colour and texture.","c":"Medical","id":58},{"q":"Signs of 2nd-degree/intermediate burn?","a":"Raw-looking skin with blisters.","w":["Waxy charred skin.","No skin change.","Only bruising."],"h":"Blistering is the clue.","c":"Medical","id":59},{"q":"Broken skin exposed to blood/body fluid: first aid?","a":"Encourage bleeding, wash with water and soap.","w":["Cover without washing.","Apply ice only.","Use alcohol drink."],"h":"Clean the exposure promptly.","c":"Medical","id":60},{"q":"Severe abdominal pain: suitable position?","a":"Reclined with knees bent.","w":["Standing upright.","Head between knees.","Prone with legs straight."],"h":"Bent knees can reduce abdominal tension.","c":"Medical","id":61},{"q":"When AED says analysing heart rhythm?","a":"Stop CPR and ensure nobody touches casualty.","w":["Continue compressions.","Remove pads.","Turn AED off."],"h":"Movement interferes with analysis.","c":"AED/CPR","id":62},{"q":"After AED shock delivered?","a":"Follow prompt and begin CPR.","w":["Remove pads.","Sit casualty upright.","Wait 5 minutes."],"h":"Resume support promptly.","c":"AED/CPR","id":63},{"q":"AED shock precaution?","a":"Do not use gaseous oxygen equipment during shock.","w":["Always move casualty from seat.","Remove pads after analysis.","Put both pads on one side."],"h":"Think fire risk.","c":"AED/CPR","id":64},{"q":"Adult AED right pad location?","a":"Below right collarbone, right of sternum.","w":["Below left breast.","Middle of back.","Directly on sternum."],"h":"Upper right chest.","c":"AED/CPR","id":65},{"q":"Infant AED pad placement?","a":"One middle chest, one middle back.","w":["Both on chest.","Both on back.","One on each arm."],"h":"Front-and-back placement.","c":"AED/CPR","id":66},{"q":"Can AED be used while casualty remains seated?","a":"Yes","w":["No","Only on ground","Only after oxygen"],"h":"The notes say it can be used in the seat.","c":"AED/CPR","id":67},{"q":"A330 Door 3 during ditching: immediate action?","a":"Guard door and redirect passengers.","w":["Open immediately.","Change to disarmed and deploy.","Pull inflation handle."],"h":"Door 3 is not primary in this case.","c":"Doors/Evacuation","id":68},{"q":"B777 Door 3 planned ditching?","a":"Change mode to MANUAL, guard and redirect.","w":["Keep AUTO and open.","Pull girt release.","Use overwing slide normally."],"h":"Door 3 requires a mode change.","c":"Doors/Evacuation","id":69},{"q":"B777 Door 3 manual inflation handle location?","a":"Upper aft corner of door frame.","w":["Right of girt bar.","Lower forward corner.","Behind CACP."],"h":"Upper and toward the tail.","c":"Doors/Evacuation","id":70},{"q":"Nose-up land evacuation usable doors?","a":"All doors/exits.","w":["All except Door 1.","Only Door 3.","All except Door 4."],"h":"No door excluded solely for nose-up attitude.","c":"Doors/Evacuation","id":71},{"q":"Door power assist fails during evacuation?","a":"Forcibly push door open until it latches.","w":["Pull inflation handle first.","Permanently guard door.","Wait for flight crew."],"h":"Use manual force on the door.","c":"Doors/Evacuation","id":72},{"q":"Airbus ARMED direction?","a":"Forward, toward the nose.","w":["Aft, toward tail.","Vertical.","Down."],"h":"Airbus points forward.","c":"Doors/Evacuation","id":73},{"q":"B777 AUTO direction?","a":"Aft, toward the tail.","w":["Forward, toward nose.","Vertical.","Down."],"h":"Opposite to Airbus ARMED.","c":"Doors/Evacuation","id":74},{"q":"Airbus cabin door pre-flight check?","a":"DISARMED, safety pin inserted, red streamer visible.","w":["ARMED with white light on.","AUTO with yellow window.","Door handle raised."],"h":"Normal ground configuration is disarmed and pinned.","c":"Doors/Evacuation","id":75},{"q":"B777 cabin door pre-flight check?","a":"MANUAL, black girt indicator windows, red arrows aligned.","w":["AUTO, yellow windows.","MANUAL, yellow windows.","AUTO, handle raised."],"h":"Look for manual, black and aligned.","c":"Doors/Evacuation","id":76},{"q":"A330/A350 release slideraft?","a":"Raise girt cover and pull white girt release handle.","w":["Pull manual inflation handle.","Open door handle.","Press SMOKE RESET."],"h":"The release handle is white under girt cover.","c":"Doors/Evacuation","id":77},{"q":"A330/A350 slide armed indicator illuminates white when?","a":"Mode ARMED and door handle moved up.","w":["Mode DISARMED.","Safety pin inserted.","Door fully closed."],"h":"Both arming and handle movement are needed.","c":"Doors/Evacuation","id":78},{"q":"Attention, Crew at Stations about 2 min before touchdown?","a":"Return to stations, secure and silent review.","w":["Continue service.","Go to interphone.","Evacuate immediately."],"h":"Final preparation.","c":"Emergency Procedures","id":79},{"q":"Four vital checks with limited preparation time?","a":"Seat belts, seat backs/TTL, tray tables, PTVs.","w":["Windows, shoes, bags, lights.","Brace, armrests, masks, doors.","Life jackets, doors, baggage, seats."],"h":"All relate to seat area.","c":"Emergency Procedures","id":80},{"q":"Silent review items include?","a":"Evacuation duties, nearest exits, emergency equipment.","w":["Meal count and local time.","Hotel and transport.","Trolley count and stock."],"h":"Focus on escape responsibilities.","c":"Emergency Procedures","id":81},{"q":"After Emergency Descent P/A?","a":"Return to seat, fasten belt, prepare for depressurisation.","w":["Continue service.","Go to flight deck.","Open masks manually."],"h":"Secure yourself first.","c":"Emergency Procedures","id":82},{"q":"After level-off following depressurisation?","a":"Check crew, seat belts and structural damage.","w":["Re-stow masks.","Resume service.","Stop oxygen immediately."],"h":"Do not re-stow deployed masks.","c":"Emergency Procedures","id":83},{"q":"Start oxygen flow from Airbus drop-down masks?","a":"Pull mask down.","w":["Wait without pulling.","Press OXY Stop.","Use MRT."],"h":"A physical pull activates flow.","c":"Emergency Procedures","id":84},{"q":"Cabin signs of depressurisation include?","a":"Bright cabin lights, signs/chimes, masks, automatic P/A.","w":["Only dim lights.","Only seat belt sign.","No automatic announcement."],"h":"There are four listed signs.","c":"Emergency Procedures","id":85},{"q":"When may an individual crew member initiate evacuation?","a":"Aircraft lands on water or breaks apart.","w":["After any rejected take-off.","Whenever P/A fails.","During refuelling only."],"h":"Only clear immediate life-threatening situations.","c":"Emergency Procedures","id":86},{"q":"Sterile flight deck at departure begins?","a":"Engine start or first aircraft movement.","w":["Door closing only.","After take-off.","At boarding."],"h":"It begins before taxi.","c":"Operations","id":87},{"q":"Refuelling with passengers: opened doors at airbridge/steps?","a":"Must be manned by cabin crew.","w":["Must be armed.","May be unattended.","Must be closed."],"h":"Usable exits stay supervised.","c":"Operations","id":88},{"q":"How flight crew indicates refuelling completed?","a":"Seat belt sign switched on.","w":["STAR briefing.","Emergency lights flash.","Smoke alarm cancelled."],"h":"A normal cabin sign is used.","c":"Operations","id":89},{"q":"Moderate/severe turbulence indication?","a":"Seat belt sign ON and flight crew P/A.","w":["Continue patrol.","Cycle sign once only.","Change doors to manual."],"h":"Both sign and announcement.","c":"Operations","id":90},{"q":"How many DG classes?","a":"9","w":["6","8","12"],"h":"Just below ten.","c":"Dangerous Goods","id":91},{"q":"Maximum dry ice per person?","a":"2.5 kg","w":["1 kg","5 kg","10 kg"],"h":"Halfway between 2 and 3 kg.","c":"Dangerous Goods","id":92},{"q":"Maximum spare lithium batteries per person?","a":"20","w":["5","10","15"],"h":"Five more than the PED limit.","c":"Dangerous Goods","id":93},{"q":"Spare lithium batteries must be in?","a":"Carry-on baggage only.","w":["Checked baggage only.","Either without restriction.","Cargo hold only."],"h":"Keep accessible in cabin.","c":"Dangerous Goods","id":94},{"q":"Maximum PED devices per person in notes?","a":"15","w":["10","20","25"],"h":"Five fewer than spare batteries.","c":"Dangerous Goods","id":95},{"q":"E-cigarettes may be carried?","a":"Carry-on only.","w":["Checked only.","Both.","Cargo only."],"h":"Not in the aircraft hold.","c":"Dangerous Goods","id":96},{"q":"One small packet of safety matches?","a":"On one’s person only.","w":["Checked bag.","Carry-on bag.","Either bag."],"h":"Not inside baggage.","c":"Dangerous Goods","id":97},{"q":"Alcohol 24–70% maximum per person?","a":"5 L","w":["1 L","2.5 L","10 L"],"h":"Same number as a hand.","c":"Dangerous Goods","id":98},{"q":"Thermometer with mercury for normal passenger?","a":"One, checked baggage only.","w":["Carry-on only.","Unlimited checked.","Forbidden in all cases."],"h":"The ordinary passenger provision is checked only.","c":"Dangerous Goods","id":99},{"q":"DG occurrence means?","a":"DG not properly loaded, segregated, secured or documented in NOTOC.","w":["Any fatal event.","Only a DG fire.","Correctly declared DG."],"h":"A compliance failure without necessarily causing harm.","c":"Dangerous Goods","id":100},{"q":"Which is forbidden?","a":"Pepper spray / mace.","w":["Secure ammunition.","Mobile phone.","Dry ice within limit."],"h":"A self-defence spray.","c":"Dangerous Goods","id":101},{"q":"Removable lithium battery fitted to baggage?","a":"Remove and carry battery in cabin.","w":["Leave installed and check bag.","Dispose of bag.","Put battery in checked bag."],"h":"Loose lithium batteries stay in carry-on.","c":"Dangerous Goods","id":102},{"q":"How identify a DG hazard label?","a":"Diamond shape, hazard symbol top, class/division number bottom.","w":["Round with text only.","Square with number top.","Triangle without symbol."],"h":"Think diamond and upper/lower information.","c":"Dangerous Goods","id":103},{"q":"DG Class 8 liquid spillage action?","a":"Wear rubber gloves and use newspaper to absorb.","w":["Use bare hands.","Pour water immediately.","Put into overhead locker."],"h":"Protect hands and absorb.","c":"Dangerous Goods","id":104},{"q":"CBTA DG test question count increased from five to?","a":"10","w":["8","15","20"],"h":"The pass mark remains 80%.","c":"Dangerous Goods","id":105},{"q":"CBTA DG test passing score?","a":"80%","w":["60%","70%","90%"],"h":"Unchanged despite more questions.","c":"Dangerous Goods","id":106},{"q":"Which scenario constitutes a dangerous goods ACCIDENT?","a":"A ground handler is seriously injured after inhaling toxic fumes from a leaking DG container during loading.","w":["Passengers feel discomfort when a pressurised aerosol ruptures.","An overhead compartment is damaged by a lithium battery fire in flight.","Labelling on a DG consignment does not match the NOTOC during loading."],"h":"An accident involves serious injury, major damage or similarly serious consequences.","c":"Dangerous Goods","id":107},{"q":"777-300/300ER: If the Door 3 deployment indicator is not visible immediately after opening the door in an emergency, what should you do?","a":"Pull the manual inflation handle at the upper aft corner of the door frame.","w":["Pull the manual inflation handle at the upper right corner.","Guard the door with the safety strap and redirect passengers.","Pull the escape strap and direct passengers to the wing."],"h":"Use the Door 3 manual inflation handle at the upper aft corner.","c":"Doors/Evacuation","id":108},{"q":"A330 ditching evacuation: What should the door primary at Type I doors do immediately?","a":"Guard the door and redirect passengers.","w":["Lead passengers forward of all exits.","Open the door in DISARMED and redirect passengers.","Open in DISARMED, evacuate first and assist in the water."],"h":"These exits are guarded rather than opened for ditching.","c":"Doors/Evacuation","id":109},{"q":"Where are the cabin emergency-lighting switches on A330/A350?","a":"FAP only.","w":["L1, L2 and L4 interphones.","Video control centre.","Any FAP and AAP."],"h":"The control is on the forward attendant panel.","c":"Emergency Procedures","id":110},{"q":"After take-off, when may cabin crew commence service?","a":"When instructed by the SCCM via an interphone call.","w":["When informed by the Captain over the P/A.","Immediately after lift-off.","Immediately after the seat-belt sign cycles."],"h":"Wait for the SCCM instruction, not merely an aircraft indication.","c":"Operations","id":111},{"q":"Which BCF extinguisher precautions are correct?","a":"Stand 6–8 feet away for the initial discharge and avoid breathing smoke or fumes.","w":["Do not allow the unit to get wet and ensure no fatty substances are on the hand.","Stand 6–8 feet away and ensure no fatty substances are on the hand.","Do not allow the unit to get wet and avoid breathing smoke or fumes."],"h":"The relevant precautions concern starting distance and avoiding fumes.","c":"Fire","id":112},{"q":"During fuelling with passengers on board, if both doors in your cabin zone have no airbridge or steps, what must be ensured?","a":"There is at least one door available for emergency deplaning in that zone.","w":["Both doors remain unobstructed throughout fuelling.","The escape system is armed.","Door primaries man both respective doors."],"h":"At least one usable deplaning exit must remain available in the zone.","c":"Operations","id":113},{"q":"Which statement about dangerous goods is correct during the flight check?","a":"Articles with a hazard label must not be allowed in the cabin.","w":["Operating crew may exempt items from DG regulations.","With the Captain’s permission, hazard-labelled packages may be carried in the cabin.","A hazard label may remain if cabin crew confirm the contents are harmless."],"h":"A visible hazard label is a clear reason not to accept the article in the cabin.","c":"Dangerous Goods","id":114},{"q":"If time permits when preparing the cabin for emergency ditching, what should be done?","a":"Distribute infant life jackets and baby flotation cots if required.","w":["Inflate the baby flotation cot and secure the baby inside.","Fit and inflate infant life jackets at the seat.","Ensure passengers do not don life jackets until impact stops."],"h":"Distribute the equipment, but do not inflate life jackets inside the cabin.","c":"Emergency Procedures","id":115},{"q":"On hearing the SCCM P/A 'Crew to interphones', which actions should you take?","a":"Go to the nearest interphone if not performing safety-related duties, and pass information to other cabin crew.","w":["Go to the interphone and return to the designated station for silent review.","Return to the designated station and continue pre-galley service.","Continue pre-galley service and pass information to other cabin crew."],"h":"The call requires interphone response and communication to the crew.","c":"Operations","id":116},{"q":"Which passengers must not be seated at emergency exit rows/seats?","a":"Deportees; passengers travelling with a guide dog; and passengers needing an MPED.","w":["Deportees and passengers travelling with a guide dog only.","Deportees and passengers needing an MPED only.","Passengers needing an MPED and those travelling with a guide dog only."],"h":"All three groups require assistance or may be unable to perform exit-row duties.","c":"Operations","id":117},{"q":"What is the principal treatment for back and neck injuries?","a":"Stabilise the neck and place thick padding on either side of the head/neck.","w":["Ask the casualty to walk to test movement.","Place the casualty in the recovery position.","Elevate the legs."],"h":"Prevent movement and support the head and neck in the found position.","c":"Medical","id":118},{"q":"When should door primaries carry out pre-take-off door procedures?","a":"Upon hearing the SCCM P/A “Cabin crew, please prepare doors for departure and cross check.”","w":["Once the last cabin door is closed.","When the safety demonstration starts.","Upon hearing “Ground personnel, please leave the aircraft now.”"],"h":"The specific SCCM door-preparation command triggers the procedure.","c":"Operations","id":119},{"q":"What should you do immediately if skin is contaminated by aircraft fuel?","a":"Remove affected clothing and wash the area with running water.","w":["Apply direct pressure.","Wait 30 minutes and call MedLink if unwell.","Air-dry the clothing to evaporate the fuel."],"h":"Remove the source and flush the skin promptly.","c":"Medical","id":120},{"q":"When will an AED advise a shock?","a":"When ventricular fibrillation (VF) is detected.","w":["Immediately after the unit is switched on.","When the AED detects no heart rhythm.","When both pads are applied."],"h":"The AED shocks a shockable rhythm such as VF.","c":"AED/CPR","id":121},{"q":"An unconscious passenger is found lying on the floor. What is the immediate action shown in the refresher question?","a":"Send another crew member to get the AED and notify the SCCM and Captain.","w":["Start CPR immediately.","Ensure the airway is closed and remove obstruction.","Check for normal breathing for 30 seconds."],"h":"Call for equipment and notify the chain of command while assessment continues.","c":"Medical","id":122},{"q":"A Class 8 hazard-label package leaks liquid in flight. What should cabin crew do?","a":"Don rubber gloves and use newspapers to absorb the spillage.","w":["Discharge a water extinguisher.","Bring it to the flight deck.","Put it in a FireSock and lock it in a lavatory."],"h":"Class 8 is corrosive: protect hands and absorb the liquid.","c":"Dangerous Goods","id":123},{"q":"Which items are dangerous goods carried in the cabin for operator use?","a":"Fire extinguishers and dry ice.","w":["Bleaches and lighter refill.","Dry ice and lighter refill.","Fire extinguishers and bleaches."],"h":"Aircraft safety equipment and catering dry ice are operator-use DG examples.","c":"Dangerous Goods","id":124},{"q":"Which item is forbidden dangerous goods?","a":"Electroshock weapons, such as Tasers.","w":["Electronic cigarettes.","Hair sprays and perfumes.","Laptop computers with lithium batteries."],"h":"Electroshock weapons are forbidden, unlike permitted items subject to conditions.","c":"Dangerous Goods","id":125},{"q":"Which statement about safety matches is correct?","a":"One small packet per person is allowed when carried on the person.","w":["It may be in carry-on baggage.","It may be in checked baggage.","Up to five packets may be carried on the person."],"h":"One small packet only, carried on the person.","c":"Dangerous Goods","id":126},{"q":"A330/A350: When a lavatory smoke detector activates, how is the cabin chime cancelled?","a":"Press any SMOKE RESET or SMOKE LAV button.","w":["Press the flashing amber light outside the lavatory.","Press the interrupt switch on the VCC.","No action; it resets after one minute."],"h":"Use the dedicated smoke reset control.","c":"Fire","id":127},{"q":"777-300/300ER nose-up land evacuation: Door 1 outside condition is safe. What should the door primary do?","a":"Open the door in AUTOMATIC, check the escape route is safe and direct passengers.","w":["Change to MANUAL, guard and redirect.","Open in AUTOMATIC and evacuate first to hold the slideraft.","Check girt-bar windows are black, then open."],"h":"Door 1 remains a usable primary exit in this attitude.","c":"Doors/Evacuation","id":128},{"q":"How do you operate the Rescu 406SE ELT on land?","a":"Turn the rotary switch to XMT mode, break the water-soluble tape and allow the antenna to erect.","w":["Turn the switch fully clockwise and hold the unit upright.","Leave the unit in ARM mode.","Select TEST and add salt to the access hole."],"h":"On land, select XMT and release the antenna.","c":"Equipment","id":129},{"q":"Which actions treat airsickness/motion sickness?","a":"Place a cool damp towel on the forehead and offer clear liquids to drink.","w":["Seat the passenger at the back and ask for a head massage.","Seat at the back and offer clear liquids.","Use a cool towel and ask for a head massage."],"h":"Cooling and small amounts of clear fluid are the useful measures listed.","c":"Medical","id":130},{"q":"Which statements correctly describe an operator's DG responsibilities?","a":"Provide forbidden-DG information at ticketing; comply with DGR; and ensure crew vigilance for undeclared DG.","w":["All four listed statements, including that cargo restrictions apply only to revenue passengers.","Ticketing information and crew vigilance only.","DGR compliance and cargo restrictions applying only to revenue passengers."],"h":"The incorrect statement is the one limiting cargo restrictions only to revenue passengers.","c":"Dangerous Goods","id":131}];const KEY='aeuV3Stats';let quiz=[],idx=0,correct=0,errors=0,locked=false,mode='practice',timerId=null,seconds=0,examAnswers={},sessionMissed=[];const $=x=>document.getElementById(x);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function st(id){let s=load();return s[id]||{attempts:0,correct:0,wrong:0,last:0}}function touch(id,ok){let s=load(),x=s[id]||{attempts:0,correct:0,wrong:0,last:0};x.attempts++;x.last=Date.now();ok?x.correct++:x.wrong++;s[id]=x;save(s)}function mastered(x){return x.attempts>0&&x.correct>=2&&x.correct/(x.correct+x.wrong)>=.75}function weak(x){return x.wrong>=2&&x.wrong>=x.correct}function refresh(){let s=load(),vals=BANK.map(q=>s[q.id]||{attempts:0,correct:0,wrong:0,last:0}),ma=vals.filter(mastered).length,we=vals.filter(weak).length,wr=vals.filter(x=>x.wrong>0&&!mastered(x)).length,p=Math.round(ma/BANK.length*100);$('mastered').textContent=ma;$('weak').textContent=we;$('savedWrong').textContent=wr;$('masterPct').textContent=p+'%';$('masterBar').style.width=p+'%';$('reviewText').textContent=wr?wr+' 題待重溫':'暫時未有錯題';$('reviewCard').disabled=wr===0;renderCats()}
const cats=[...new Set(BANK.map(x=>x.c))].sort();function init(){cats.forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('category').appendChild(o)});refresh()}function renderCats(){let s=load();$('categoryGrid').innerHTML='';cats.forEach(c=>{let qs=BANK.filter(q=>q.c===c),ma=qs.filter(q=>mastered(s[q.id]||{})).length,b=document.createElement('button');b.className='btn catbtn';b.innerHTML=`<b>${c}</b><small>${ma}/${qs.length} 已掌握</small>`;b.onclick=()=>start('practice',qs,`${c} 練習`);$('categoryGrid').appendChild(b)})}
function quickStart(){let pool=$('category').value==='All'?BANK:BANK.filter(q=>q.c===$('category').value),n=$('count').value;if(n!=='all')pool=shuffle(pool).slice(0,+n);start('practice',pool,'隨機練習')}
function startReview(){let s=load(),pool=BANK.filter(q=>(s[q.id]?.wrong||0)>0&&!mastered(s[q.id]||{}));if(!pool.length)return alert('暫時未有需要重溫的錯題。');pool.sort((a,b)=>(s[b.id].wrong-s[b.id].correct)-(s[a.id].wrong-s[a.id].correct));start('review',pool,'錯題重溫')}
function startSprint(){let s=load(),used=new Set(),out=[];let w=BANK.filter(q=>weak(s[q.id]||{})).sort((a,b)=>(s[b.id].wrong||0)-(s[a.id].wrong||0));for(let q of w.slice(0,10)){out.push(q);used.add(q.id)}let old=BANK.filter(q=>!used.has(q.id)).sort((a,b)=>(s[a.id]?.last||0)-(s[b.id]?.last||0));for(let q of old.slice(0,5)){out.push(q);used.add(q.id)}for(let q of shuffle(BANK.filter(q=>!used.has(q.id))).slice(0,20-out.length))out.push(q);start('sprint',shuffle(out),'考前衝刺')}
function startExam(){start('exam',shuffle(BANK).slice(0,40),'模擬考試');seconds=40*60;$('timer').classList.remove('hidden');tick();timerId=setInterval(tick,1000)}function tick(){let m=Math.floor(seconds/60),s=seconds%60;$('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;if(seconds--<=0){clearInterval(timerId);finishExam()}}
function start(m,pool,label){if(!pool.length)return;mode=m;quiz=shuffle(pool);idx=correct=errors=0;locked=false;examAnswers={};sessionMissed=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('mode').textContent=label;$('timer').classList.add('hidden');document.body.classList.add('inquiz');render()}
function render(){locked=false;let q=quiz[idx];$('cat').textContent=q.c;$('qno').textContent=`${idx+1} / ${quiz.length}`;$('question').textContent=q.q;$('feedback').className='feedback';$('feedback').textContent='';$('next').classList.add('hidden');$('hint').classList.toggle('hidden',mode==='exam');$('options').innerHTML='';shuffle([q.a,...q.w]).forEach((t,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="letter">${'ABCD'[i]}</span><span>${t}</span>`;b.onclick=()=>answer(b,t);$('options').appendChild(b)});stats();scrollTo({top:0,behavior:'instant'})}
function answer(btn,text){if(locked)return;let q=quiz[idx];if(mode==='exam'){document.querySelectorAll('.opt').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');examAnswers[q.id]=text;locked=true;$('next').classList.remove('hidden');$('next').textContent=idx===quiz.length-1?'提交試卷':'下一題 →';return}if(btn.classList.contains('wrong'))return;if(text===q.a){locked=true;btn.classList.add('correct');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);correct++;touch(q.id,true);$('feedback').className='feedback good show';$('feedback').innerHTML='✅ <b>答啱！</b>';$('next').classList.remove('hidden');stats();setTimeout(nextQuestion,700)}else{btn.classList.add('wrong');btn.disabled=true;errors++;touch(q.id,false);sessionMissed.push(q.id);$('feedback').className='feedback bad show';$('feedback').innerHTML='❌ <b>未啱，再試一次。</b> 可以按 Hint。';stats()}}
function showHint(){$('feedback').className='feedback bad show';$('feedback').innerHTML='💡 <b>Hint：</b>'+quiz[idx].h}function nextQuestion(){if(mode==='exam'&&!locked)return;if(mode!=='exam'&&!locked)return;if(idx<quiz.length-1){idx++;render()}else mode==='exam'?finishExam():finish()}
function stats(){$('progress').style.width=(idx/quiz.length*100)+'%';if(mode==='exam'){$('statLeft').textContent=`已答 ${Object.keys(examAnswers).length}`;$('statRight').textContent=`尚餘 ${quiz.length-Object.keys(examAnswers).length}`}else{$('statLeft').textContent=`答啱 ${correct}`;$('statRight').textContent=`錯誤 ${errors}`}}
function finishExam(){clearInterval(timerId);correct=0;sessionMissed=[];quiz.forEach(q=>{let ok=examAnswers[q.id]===q.a;touch(q.id,ok);if(ok)correct++;else sessionMissed.push(q.id)});finish()}
function finish(){clearInterval(timerId);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');document.body.classList.remove('inquiz');let pct=Math.round(correct/quiz.length*100);$('resultTitle').textContent=mode==='exam'?'模擬考試結果':'完成練習 🎉';$('finalScore').textContent=pct+'%';$('finalText').textContent=`${quiz.length} 題中答啱 ${correct} 題。${mode==='exam'?'合格參考線：80%。':''}`;let by={};quiz.forEach(q=>{by[q.c]??={n:0,ok:0};by[q.c].n++;if(mode==='exam'?examAnswers[q.id]===q.a:!sessionMissed.includes(q.id))by[q.c].ok++});$('breakdown').innerHTML=Object.entries(by).map(([c,x])=>`<div class="row"><span>${c}</span><b>${x.ok}/${x.n} (${Math.round(x.ok/x.n*100)}%)</b></div>`).join('');let misses=[...new Set(sessionMissed)].map(id=>BANK.find(q=>q.id===id)).filter(Boolean);$('missed').innerHTML=misses.length?'<h3>今次錯題</h3>'+misses.map(q=>`<details><summary>${q.q}</summary><p><b>答案：</b>${q.a}</p><p><b>Hint：</b>${q.h}</p></details>`).join(''):'<p>今次冇錯題，做得好！</p>';refresh();scrollTo(0,0)}
function goHome(){clearInterval(timerId);$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden');document.body.classList.remove('inquiz');refresh();scrollTo(0,0)}function clearData(){if(confirm('確定清除所有答題、弱項及進度紀錄？')){localStorage.removeItem(KEY);refresh()}}init();
</script></body></html>
